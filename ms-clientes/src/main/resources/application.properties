spring.application.name=ms-clientes
server.port = 8020

spring.datasource.url = jdbc:mysql://localhost:3306/ms_clientes
spring.datasource.username = root
spring.datasource.password = admin
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

spring.jpa.database-platform = org.hibernate.dialect.MySQLDialect
spring.jpa.generate-ddl = true
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true

# Configuración para manejar mejor los tipos de datos y errores
spring.jackson.default-property-inclusion = NON_NULL
spring.jackson.serialization.write-null-map-values = false
spring.jackson.serialization.fail-on-empty-beans = false
spring.jackson.deserialization.fail-on-unknown-properties = false

logging.level.org.hibernate.SQL = DEBUG
logging.level.com.grupo.allfym.ms_proveedores.clientes = DEBUG
